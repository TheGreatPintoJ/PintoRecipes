name: PintoRecipes
version: '1.8'
main: me.pintoadmin.pintoRecipes.PintoRecipes
api-version: '1.21'
authors: [ PintoJ ]

commands:
  pintorecipes:
    usage: /pintorecipes <show|save|edit|list|remove> [recipe_name]
    description: Manage recipes
    permission: pintorecipes.recipes
    aliases: [pr, precipes]
  uncraft:
    usage: /uncraft
    description: Open uncrafting GUI
    permission: pintorecipes.uncraft

permissions:
  pintorecipes.recipes:
    description: Permission to use /pintorecipes
    default: op
  pintorecipes.recipes.show:
    description: Permission to use subcommand "show" in /pintorecipes
    default: true
  pintorecipes.recipes.save:
    description: Permission to use subcommand "save" in /pintorecipes
    default: op
  pintorecipes.recipes.edit:
    description: Permission to use subcommand "edit" in /pintorecipes
    default: op
  pintorecipes.recipes.list:
    description: Permission to use subcommand "list" in /pintorecipes (or to use /pintorecipes without arguments)
    default: true
  pintorecipes.recipes.remove:
    description: Permission to use subcommand "remove" in /pintorecipes
    default: op
  pintorecipes.recipes.reload:
    description: Permission to use subcommand "reload" in /pintorecipes
    default: op
  pintorecipes.craftbypass:
    description: Permission to bypass crafting limits
    default: false
  pintorecipes.uncraft:
    description: Permission to use uncrafting command
    default: true